services:
  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: miranda
      POSTGRES_PASSWORD: miranda
      POSTGRES_DB: opencord
    volumes:
      - database_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U miranda -d opencord" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  database_data:
