services:
  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: miranda
      POSTGRES_PASSWORD: miranda
      POSTGRES_DB: opencord
    volumes:
      - database_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U miranda -d opencord" ]
      interval: 10s
      timeout: 5s
      retries: 5
  livekit:
    image: livekit/livekit-server:latest
    container_name: opencord_sfu
    command: --dev --bind 0.0.0.0 --node-ip 192.168.15.7
    ports:
      - "8000:7880"      # Porta da API REST e Sinalização WebSocket (Importante para o Spring e Client)
      - "5520:5520"      # Porta de fallback TCP para WebRTC
      - "8001:8001/udp"  # Porta primária UDP para tráfego de Áudio e Vídeo (WebRTC)
    environment:
      LIVEKIT_KEYS: "devkey: super-secret-key-opencord-livekit-2026"
      LIVEKIT_RTC_UDP_PORT: 8001
      LIVEKIT_RTC_TCP_PORT: 5520
    networks:
      - opencord-network

volumes:
  database_data:

networks:
  opencord-network:
    driver: bridge
