<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opencord - Chat & WebRTC</title>
    <!-- Mantemos as bibliotecas do STOMP para o Chat de Texto -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; height: 100vh; }

        /* HEADER & LOGIN */
        .header { background: #11111b; padding: 15px 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #313244; }
        .header input { flex: 1; max-width: 400px; padding: 8px; background: #313244; border: 1px solid #45475a; color: #cdd6f4; border-radius: 4px; }
        .header button { padding: 8px 15px; background-color: #89b4fa; color: #11111b; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .header button:disabled { background-color: #45475a; cursor: not-allowed; }
        #userInfo { margin-left: auto; font-size: 0.9em; color: #a6adc8; font-weight: bold; }

        /* MAIN LAYOUT */
        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* SIDEBAR (CANAIS) */
        .sidebar { width: 280px; background: #181825; border-right: 1px solid #313244; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; font-weight: bold; border-bottom: 1px solid #313244; background: #1e1e2e; }
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { padding: 12px; margin-bottom: 5px; background: #313244; border-radius: 6px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .channel-item:hover { background: #45475a; }
        .channel-item.active { background: #89b4fa; color: #11111b; font-weight: bold; }

        /* CONTENT AREA (VIDEO + CHAT) */
        .content-area { flex: 1; display: flex; flex-direction: column; background: #1e1e2e; }

        /* CALL HEADER & CONTROLS */
        .chat-header { padding: 15px; background: #181825; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
        .call-controls { display: flex; gap: 10px; }
        .btn-call { background-color: #a6e3a1; color: #11111b; padding: 8px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; display: none; }
        .btn-call.danger { background-color: #f38ba8; }

        /* VIDEO GRID (WEBRTC) */
        .video-grid { display: none; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; padding: 20px; background: #11111b; border-bottom: 1px solid #313244; max-height: 50vh; overflow-y: auto; }
        .video-grid.active { display: grid; }
        .video-container { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 0.8em; }

        /* CHAT MESSAGES */
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { padding: 10px 14px; border-radius: 8px; max-width: 70%; line-height: 1.4; }
        .message-row { display: flex; flex-direction: column; margin-bottom: 5px; }
        .message-row.me { align-items: flex-end; }
        .message-row.them { align-items: flex-start; }
        .message-bubble.me { background: #89b4fa; color: #11111b; }
        .message-bubble.them { background: #313244; color: #cdd6f4; }
        .message-sender { font-size: 0.8em; margin-bottom: 4px; color: #a6adc8; }
        .message-row.me .message-sender { display: none; }

        /* CHAT INPUT */
        .input-area { padding: 15px; background: #181825; border-top: 1px solid #313244; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px; background: #313244; border: 1px solid #45475a; color: #cdd6f4; border-radius: 6px; }
        .input-area button { padding: 10px 20px; background-color: #89b4fa; color: #11111b; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .input-area button:disabled { background-color: #45475a; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="header">
    <input type="text" id="jwtToken" placeholder="Cole seu Token JWT (Bearer) do Opencord...">
    <button id="connectBtn">Conectar ao App</button>
    <button id="disconnectBtn" disabled>Desconectar</button>
    <div id="userInfo">Desconectado</div>
</div>

<div class="main-container">
    <div class="sidebar">
        <div class="sidebar-header">Mensagens Diretas</div>
        <div class="channel-list" id="channelList">
            <!-- Canais renderizados via JS -->
        </div>
    </div>

    <div class="content-area">
        <div class="chat-header">
            <span id="chatHeaderTitle">Selecione uma conversa</span>
            <div class="call-controls">
                <button id="joinCallBtn" class="btn-call">Iniciar Voz/Vídeo</button>
                <button id="leaveCallBtn" class="btn-call danger">Sair da Call</button>
            </div>
        </div>

        <div class="video-grid" id="videoGrid">
            <!-- Os elementos <video> e <audio> do LiveKit entrarão aqui -->
        </div>

        <div class="messages-container" id="messagesContainer">
            <!-- Mensagens de texto -->
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Envie uma mensagem..." disabled>
            <button id="sendBtn" disabled>Enviar</button>
        </div>
    </div>
</div>

<!-- Importa o arquivo JS como módulo (Padrão Vite) -->
<script type="module" src="./main.js"></script>

</body>
</html>
